<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1400,&quot;height&quot;:100},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;browse&quot;,&quot;sell&quot;,&quot;how&quot;,&quot;faq&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { lang: 0, menu: false, mob: window.innerWidth < 1180 };
  componentDidMount() { this._r = () => { const m = window.innerWidth < 1180; if (m !== this.state.mob) this.setState({ mob: m }); }; window.addEventListener('resize', this._r); this._r(); }
  componentWillUnmount() { window.removeEventListener('resize', this._r); }
  renderVals() {
    const a = this.props.active || '';
    const st = (k) => (a === k ? 'active' : 'default');
    const go = (u) => () => { window.location.href = u; };
    return {
      sBrowse: st('browse'), sSell: st('sell'), sHow: st('how'), sFaq: st('faq'),
      goBrowse: go('Browse.dc.html'), goSell: go('Sell Wizard.dc.html'), goHow: go('Landing.dc.html#how'),
      goFaq: go('Landing.dc.html#faq'), goBuy: go('Buyer Match.dc.html'),
      nav: { style: { whiteSpace: 'nowrap', padding: '10px 12px' } }, langs: ['EN', 'عربي'], lang: this.state.lang,
      mob: this.state.mob, desk: !this.state.mob, menuOpen: this.state.mob && this.state.menu,
      menuIcon: this.state.menu ? 'FiX' : 'FiMenu', toggleMenu: () => this.setState({ menu: !this.state.menu }),
      langShort: this.state.lang ? 'EN' : 'ع', toggleLang: () => this.setState({ lang: this.state.lang ? 0 : 1 }),
      aBrowse: a === 'browse', aSell: a === 'sell', aHow: a === 'how', aFaq: a === 'faq',
      mi: { style: { padding: '12px', font: '400 16px/20px var(--font-core)' } }, setLang: (i) => this.setState({ lang: i }),
    };
  }
}
</script>
